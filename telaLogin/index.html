<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de login</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="app_teste">
        <div class="container">
            <div class="itens">
                <div class="Campo">
                    <img class="imagemUsuario" src="./icons/icon.png" alt="icone Usuario Login">
                    <input type="text" placeholder="Digite seu nome">
                </div>
                <div class="Campo">
                    <img class="iconeSenha" src="./icons/senha.png"
                        alt="Icone de cadeado para indicar o campo de senha">
                    <input type="password" placeholder="Digite sua senha">
                </div>

                <a class="botaoLogin" href="../telaPrincipal/index.html">
                    <button><p class="escritaLogin">LOGIN</p></button>
                </a>

            </div>
        </div>
    </div>
</body>

</html>
